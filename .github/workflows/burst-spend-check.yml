name: Burst / Spend Sanity Check (Day 5)

# Manually triggered - Day 5 task (U2/U3 from Day5-Polish-CostCheck-Outreach.md,
# issue #3): fire a short burst at POST /api/recommendation and confirm rate
# limiting actually kicks in as expected, not just that the code exists.
#
# Runs two simulated visitors (two separate session cookies) from this one
# runner, each firing a few rapid real calls - real Anthropic spend, kept
# deliberately small (a handful of calls, not enough to fully exhaust either
# limiter's hourly cap). Reports each call's HTTP status and the
# RateLimit-* response headers so a human can eyeball whether per-session and
# per-IP limiting are behaving sanely, then cross-check actual spend in the
# Anthropic console against the configured cap.
on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Live URL to test against"
        required: true
        type: string
      calls_per_session:
        description: "Real POST /api/recommendation calls per simulated visitor"
        required: false
        type: string
        default: "4"

jobs:
  burst-check:
    runs-on: ubuntu-latest
    steps:
      - name: Fire burst from two simulated visitors
        env:
          BASE_URL: ${{ inputs.base_url }}
          CALLS: ${{ inputs.calls_per_session }}
        run: |
          set -u
          # Normalize: a trailing slash on the input produced "//api/..." and
          # 404s on every call (run #6), which this job used to report green.
          BASE_URL="${BASE_URL%/}"
          echo "Base URL: $BASE_URL"
          SAW_200=0
          for VISITOR in A B; do
            echo "=== Visitor $VISITOR ==="
            JAR="cookies-$VISITOR.txt"
            rm -f "$JAR"
            # Actions runs bash with -e: keep curl failures (DNS, refused) from
            # killing the job silently, and report them with the URL instead.
            LANDING=$(curl -sS -c "$JAR" -o /dev/null -w "%{http_code}" "$BASE_URL/" || true)
            if [ "$LANDING" != "200" ]; then
              echo "::error title=Visitor $VISITOR landing page failed::HTTP ${LANDING:-000} from GET $BASE_URL/"
              exit 1
            fi
            for i in $(seq 1 "$CALLS"); do
              STATUS_AND_HEADERS=$(curl -sS -b "$JAR" -X POST "$BASE_URL/api/recommendation" \
                -H "Content-Type: application/json" \
                -d "{\"id\": $(( (i % 16) + 1 ))}" \
                -D - -o /tmp/body_${VISITOR}_${i}.json -w "HTTP_STATUS:%{http_code}\n" || true)
              STATUS=$(echo "$STATUS_AND_HEADERS" | grep -o "HTTP_STATUS:[0-9]*" || true)
              REMAIN=$(echo "$STATUS_AND_HEADERS" | grep -i "ratelimit-remaining" | tr -d '\r' || true)
              LIMIT=$(echo "$STATUS_AND_HEADERS" | grep -i "ratelimit-limit:" | tr -d '\r' || true)
              echo "::notice title=Visitor $VISITOR call $i::$STATUS  $LIMIT  $REMAIN"
              CODE="${STATUS#HTTP_STATUS:}"
              case "$CODE" in
                200)
                  SAW_200=1
                  ;;
                429)
                  echo "::notice title=Visitor $VISITOR call $i::rate limited (expected once the cap engages)"
                  ;;
                *)
                  BODY=$(cat /tmp/body_${VISITOR}_${i}.json 2>/dev/null | tr '\n' ' ' | cut -c1-400)
                  echo "::error title=Visitor $VISITOR call $i unexpected status::HTTP ${CODE:-none} from POST $BASE_URL/api/recommendation  BODY: $BODY"
                  exit 1
                  ;;
              esac
            done
          done
          if [ "$SAW_200" -ne 1 ]; then
            echo "::error title=No successful calls::Zero 200s across both visitors - nothing reached the Anthropic API, so spend/rate-limit behavior was not validated"
            exit 1
          fi
