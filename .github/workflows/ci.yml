name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest

    # Postgres 16 to match the version deployed on Upsun (.upsun/config.yaml).
    # The app's own initDb() creates the decisions_log table against this
    # service container on boot - same code path as production, so the test
    # schema can never drift from what the app actually creates.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: learners_permit_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U testuser"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://testuser:testpass@localhost:5432/learners_permit_ci
      SESSION_SECRET: ci-test-secret-not-for-production
      PORT: 3100
      # ANTHROPIC_API_KEY deliberately not set - see TestPlan v3 Section 10.
      # None of the CI-gated specs (logic/ui/api-mocked) call the real
      # Anthropic route; C4/I1-I3 mock POST /api/recommendation directly.

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright specs (logic, ui, api-mocked)
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
